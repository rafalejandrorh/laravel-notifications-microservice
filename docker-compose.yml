services:

  app:
    image: notificaciones-app-dev
    env_file:
      - .env
    environment:
      - APP_URL=http://localhost:8003
      - MONGODB_URI=mongodb://mongodb:27017
      - MESSENGER_TRANSPORT_DSN=amqp://guest:guest@rabbitmq:5672/%2f
      - MESSENGER_FAILURE_DSN=amqp://guest:guest@rabbitmq:5672/%2f
    container_name: notificaciones-app
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    build:
      context: .
      dockerfile: build/dev/Dockerfile.dev
    volumes:
      - .:/var/www/html
      - notificaciones_vendor:/var/www/html/vendor
      - notificaciones_cache:/var/www/html/bootstrap/cache
      - notificaciones_storage_cache:/var/www/html/storage/framework/cache
      - notificaciones_storage_views:/var/www/html/storage/framework/views
    working_dir: /var/www/html
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - notificaciones_network

  nginx:
    image: nginx:alpine
    container_name: notificaciones-nginx
    depends_on:
      - app
    ports:
      - "8003:80"
    volumes:
      - .:/var/www/html
      - notificaciones_vendor:/var/www/html/vendor
      - notificaciones_cache:/var/www/html/bootstrap/cache
      - notificaciones_storage_cache:/var/www/html/storage/framework/cache
      - notificaciones_storage_views:/var/www/html/storage/framework/views
      - ./build/dev/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - notificaciones_network

  mongodb:
    image: mongo:7
    container_name: notificaciones-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: notificaciones
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notificaciones_network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: notificaciones-rabbitmq
    restart: unless-stopped
    ports:
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - notificaciones_network

networks:
  notificaciones_network:
    driver: bridge

volumes:
  mongo_data:
  notificaciones_vendor:
  notificaciones_cache:
  notificaciones_storage_cache:
  notificaciones_storage_views:
